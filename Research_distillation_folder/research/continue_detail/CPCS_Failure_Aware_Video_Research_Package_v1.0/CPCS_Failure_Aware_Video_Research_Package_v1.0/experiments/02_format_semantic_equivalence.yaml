schema_version: cpcs.experiment_plan/1.0
experiment_id: experiment://failure/format_semantic_equivalence/1
title: Prompt serialization semantic-equivalence ablation
status: designed_not_run
blocked_reason: No authorized provider credentials, generation budget, local model weights, or human rating panel were supplied
  in this session.
research_question: Does any serialization improve adherence when canonical meaning, provider prompt budget, and information
  content are matched?
hypothesis: Single-authority concise projections will match or outperform duplicated multi-format prompts on adherence per
  character; no format will be universally superior across providers.
providers:
- provider: google_vertex_ai
  model: veo-3.1-generate-001
  status: candidate_requires_authorization_and_live_profile_check
- provider: runway
  model: gen4.5
  status: candidate_requires_authorization
- provider: bytedance_seed
  model: Seedance 2.0 native exact endpoint TBD
  status: candidate_requires_interface_capture
- provider: kuaishou
  model: Kling Video 3.0/Omni exact endpoint TBD
  status: candidate_requires_interface_capture
- provider: minimax
  model: MiniMax-Hailuo-2.3
  status: candidate_requires_authorization
- provider: alibaba_model_studio
  model: wan2.7 exact endpoint by mode
  status: candidate_requires_region_and_endpoint_pin
- provider: local
  model: LTX-2 or Wan2.2 exact checkpoint/workflow
  status: candidate_requires_weights_and_hardware_workflow
fixed_factors:
  canonical_score: one frozen content-addressed score
  scene: two-actor ordered action with identity, spatial, causal, and terminal-state locks
  prompt_semantics: equivalent fields and priorities
  reference_assets: none
  duration_and_seed_policy: identical within provider
arms:
- arm_id: FMT_A0
  label: Natural language
  isolated_control: serialization only
  canonical_semantics: identical canonical controls
  provider_projection: ordered concise prose
- arm_id: FMT_A1
  label: Flat YAML
  isolated_control: serialization only
  canonical_semantics: identical canonical controls
  provider_projection: flat YAML string where provider accepts prompt text
- arm_id: FMT_A2
  label: XML
  isolated_control: serialization only
  canonical_semantics: identical canonical controls
  provider_projection: compact XML string
- arm_id: FMT_A3
  label: JSON
  isolated_control: serialization only
  canonical_semantics: identical canonical controls
  provider_projection: compact JSON string
- arm_id: FMT_A4
  label: XML plus JSON
  isolated_control: duplicate representation
  canonical_semantics: identical canonical controls duplicated
  provider_projection: hybrid prompt
- arm_id: FMT_A5
  label: XML plus JSON plus YAML
  isolated_control: triple duplication
  canonical_semantics: identical canonical controls triplicated
  provider_projection: hybrid prompt
- arm_id: FMT_A6
  label: Provider-native optimized prose
  isolated_control: adapter-specific compression
  canonical_semantics: identical canonical controls
  provider_projection: provider-native syntax and ordering without semantic additions
seed_policy:
  initial_completed_candidates_per_arm: 20
  open_local_target_per_arm: 30
  pairing: Use identical seed values within provider where exposed; record retry/sample identifiers when seeds are unavailable.
  interpretation: Seed pairing reduces one variation source but does not imply identical output or perfect causal isolation.
  randomization: Randomize arm execution order within provider and batch; do not select best-of-N for the primary analysis.
metrics:
- metric_prompt_semantic_equivalence
- metric_field_projection_coverage
- metric_hard_lock_retention
- metric_prompt_truncation_loss
- metric_instruction_coverage
- metric_primary_action_completion
critical_assertions:
- all hard canonical controls are represented
- no contradictory duplicate field is introduced
- event order and terminal state remain identical
- prompt length and provider rewrite behavior are captured
human_review:
  required: true
  minimum_reviewers: 2
  blind_to_arm: true
  adjudication: A third reviewer adjudicates disagreement on any critical assertion; preserve all original labels.
retention:
  retain_all_outputs: true
  retain_failed_outputs: true
  required_lineage:
  - canonical_score
  - provider_build
  - request
  - assets
  - provider/model/version
  - seed_or_retry
  - artifact
  - evaluators
  - human_labels
  - cost
  - latency
analysis:
  binary_outcomes: Per-arm success proportion with Wilson 95% confidence interval; paired analysis where pairing is valid.
  continuous_outcomes: Median, distribution, and bootstrap 95% interval; report failed intervals, not only aggregate means.
  multiple_comparisons: Holm correction within each family; predeclare the primary contrast.
  decision_rule: Promote only when the isolated intervention improves the critical success distribution and does not increase
    another critical failure beyond its pre-registered margin.
stop_conditions:
- Provider/interface/version changes during the campaign.
- Prompt rewrite or enhancement behavior cannot be disabled or captured consistently.
- Evaluator calibration falls below the pre-registered requirement.
- Artifact/request/asset lineage is incomplete.
- A safety, rights, or budget condition is violated.
